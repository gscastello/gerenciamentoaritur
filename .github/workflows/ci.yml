name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend

# NOTA: ainda não há frontend/package-lock.json commitado (gerado no
# primeiro `npm install` local). Enquanto isso o CI usa `npm install` e
# não faz cache. Assim que o lockfile entrar no repo, trocar para
# `npm ci` + `cache: npm` + `cache-dependency-path: frontend/package-lock.json`.
env:
  NODE_VERSION: "22"

jobs:
  quality:
    name: Lint · Knip · Arquitetura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run knip
      - run: npm run arch

  test:
    name: Unit · Integração (Vitest + Codecov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm install --no-audit --no-fund
      - run: npm run test
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: frontend/coverage/lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  mutation:
    name: Mutation testing (Stryker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm install --no-audit --no-fund
      - run: npm run test:mutation

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm install --no-audit --no-fund
      - run: npm run build
        env:
          VITE_RELEASE: ${{ github.sha }}

  # O DEPLOY é feito pelo host (Vercel/Netlify) via integração com o Git:
  #   - push na `main`  -> deploy de produção
  #   - cada PR         -> deploy de preview
  # Ver frontend/DEPLOY.md. O CI aqui só roda os gates de qualidade.
  #
  # TODO(#3): quando o Sentry estiver configurado, adicionar aqui um job
  # `release` (só em push na main) que faz o upload dos source maps com
  # SENTRY_AUTH_TOKEN e marca a release = ${{ github.sha }}.
