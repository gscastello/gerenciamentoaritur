name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend

env:
  NODE_VERSION: "22"

jobs:
  quality:
    name: Lint · Knip · Arquitetura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run knip
      - run: npm run arch

  audit:
    name: Auditoria de dependências
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      # Gate real = o que VAI PRO NAVEGADOR (deps de produção). Quebra em
      # high/critical. As deps de dev/build (stryker, vitest…) não sobem no
      # bundle — ficam para os PRs do Dependabot (.github/dependabot.yml).
      - run: npm audit --omit=dev --audit-level=high
      # Informativo: árvore completa (dev incluso) no log, sem quebrar.
      - run: npm audit --audit-level=moderate || true

  test:
    name: Unit · Integração (Vitest + Codecov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run test
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: frontend/coverage/lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  mutation:
    name: Mutation testing (Stryker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run test:mutation

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
        env:
          VITE_RELEASE: ${{ github.sha }}

  # O DEPLOY é feito pelo host (Vercel/Netlify) via integração com o Git:
  #   - push na `main`  -> deploy de produção
  #   - cada PR         -> deploy de preview
  # Ver frontend/DEPLOY.md. O CI aqui só roda os gates de qualidade.
  #
  # TODO(#3): quando o Sentry estiver configurado, adicionar aqui um job
  # `release` (só em push na main) que faz o upload dos source maps com
  # SENTRY_AUTH_TOKEN e marca a release = ${{ github.sha }}.
