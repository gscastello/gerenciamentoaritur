version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 8
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      prod-patches:
        dependency-type: production
        update-types: [patch]
    # Bump major sozinho costuma quebrar o npm ci por conflito de peer dep
    # (ex.: vite 8 sem @vitejs/plugin-react novo, typescript 7 sem o knip
    # atualizado) — upgrade major é decisão manual, coordenada, não PR
    # automático. Ver AGENTS.md / não subir Tailwind p/ v4 sem migração.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    labels: [dependencies]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, ci]
